[package]
name = "mindverse"
version = "0.1.0"
description = "MindVerse 桌面客户端"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mindverse-server = { path = "../server" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

[profile.release]
strip = true
lto = true
